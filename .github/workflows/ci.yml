name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: dry-run install (all agents)
        shell: bash
        run: bash install.sh --dry-run
